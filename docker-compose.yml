# Runs the Arodan database and API together on one server.
#   1. cp server/.env.example .env   and fill it in
#   2. docker compose up -d --build
#   3. docker compose exec api node scripts/seed.js   (first time only: starter catalogue)
# On a public server, add HTTPS with:  docker compose --profile https up -d --build   (needs DOMAIN in .env)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: arodan
      POSTGRES_USER: arodan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arodan -d arodan"]
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://arodan:${POSTGRES_PASSWORD}@db:5432/arodan
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  https:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - api

volumes:
  db-data:
  caddy-data:
